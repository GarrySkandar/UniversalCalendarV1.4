name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          for test in tests_*.js; do
            node "$test"
          done

      - name: Run Python checks
        run: |
          python -m py_compile server.py
          python tests_lunar_cultural_label.py
